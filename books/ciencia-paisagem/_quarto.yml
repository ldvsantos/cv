project:
  type: book
  output-dir: _book

book:
  title: "Ciência da Paisagem"
  subtitle: "Fundamentos, Métodos de Análise e Planejamento Territorial"
  author:
    - name: "Luiz Diego Vidal Santos"
      url: https://diegovidalcv.com.br/
      orcid: 0000-0001-8659-8557
      affiliation:
        - name: "Universidade Estadual de Feira de Santana (UEFS)"
          url: https://www.uefs.br/
  date: "2026-02-15"
  date-format: "DD/MM/YYYY"
  description: |
    Livro-texto sobre Ciência da Paisagem com ênfase em análise da paisagem,
    integrando ecologia da paisagem, métricas espaciais, sensoriamento remoto,
    geoprocessamento e planejamento territorial para gestão sustentável
    de paisagens tropicais.
  cover-image: img/capa_ciencia_paisagem.png
  favicon: img/capa_ciencia_paisagem.png
  reader-mode: true
  site-url: https://diegovidalcv.com.br/books/ciencia-paisagem/
  repo-url: https://github.com/ldvsantos/cv/
  repo-actions: [issue]
  sharing: [twitter, facebook, linkedin]
  downloads: [pdf]
  search: true

  page-footer:
    left: "© Luiz Diego Vidal Santos, 2026. [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
    right: "Feito com [Quarto](https://quarto.org)"

  chapters:
    - index.qmd
    - prefacio.qmd

    - part: "Parte I — Fundamentos da Ciência da Paisagem"
      chapters:
        - capitulos/01-introducao.qmd
        - capitulos/02-ecologia-paisagem.qmd
        - capitulos/03-estrutura-paisagem.qmd
        - capitulos/04-escalas.qmd
        - capitulos/05-percepcao-representacao.qmd

    - part: "Parte II — Métodos de Análise da Paisagem"
      chapters:
        - capitulos/06-sensoriamento-remoto.qmd
        - capitulos/07-sig-paisagem.qmd
        - capitulos/08-uso-cobertura.qmd
        - capitulos/09-metricas-paisagem.qmd
        - capitulos/10-fragmentacao-conectividade.qmd
        - capitulos/11-deteccao-mudancas.qmd

    - part: "Parte III — Processos e Dinâmica"
      chapters:
        - capitulos/12-dinamica-uso-solo.qmd
        - capitulos/13-processos-hidrologicos.qmd
        - capitulos/14-servicos-ecossistemicos.qmd
        - capitulos/15-biodiversidade-heterogeneidade.qmd
        - capitulos/16-mudancas-climaticas.qmd

    - part: "Parte IV — Planejamento e Gestão da Paisagem"
      chapters:
        - capitulos/17-planejamento-paisagem.qmd
        - capitulos/18-restauracao-ecologica.qmd
        - capitulos/19-corredores-areas-protegidas.qmd
        - capitulos/20-modelagem-cenarios.qmd
        - capitulos/21-projeto-integrador.qmd

    - referencias.qmd

bibliography: references.bib
csl: https://raw.githubusercontent.com/citation-style-language/styles/master/apa.csl

format:
  html:
    theme:
      - cosmo
      - custom.scss
    code-link: true
    lang: pt-BR
    fig-align: center
  pdf:
    documentclass: scrbook
    papersize: a4
    fontsize: 11pt
    lang: pt
    toc: true
    number-sections: true
    colorlinks: true
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=3cm
      - right=2cm

lang: pt-BR
