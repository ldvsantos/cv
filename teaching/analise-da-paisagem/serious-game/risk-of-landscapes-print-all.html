<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISK OF LANDSCAPES — Impressão Completa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

@page{size:A4 landscape;margin:8mm;}

html,body{
  background:#111;
  font-family:'Crimson Text',Georgia,serif;
  color:#f0e6d2;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ═══════ CONTROL PANEL ═══════ */
.controls{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  background:rgba(20,20,20,0.97);
  border-bottom:2px solid #8B7355;
  padding:12px 24px;
  display:flex;flex-wrap:wrap;align-items:center;gap:16px;
  font-family:'Cinzel',serif;font-size:11px;color:#d4c8b0;
}
.controls h1{font-size:14px;color:#8B7355;letter-spacing:2px;margin-right:auto;}
.controls label{cursor:pointer;display:flex;align-items:center;gap:4px;}
.controls input[type=checkbox]{accent-color:#8B7355;}
.controls button{
  background:#8B7355;color:#1c1c1c;border:none;
  padding:6px 18px;border-radius:3px;cursor:pointer;
  font-family:'Cinzel',serif;font-weight:700;font-size:11px;
  letter-spacing:1px;
}
.controls button:hover{background:#a08a64;}
.controls .info{font-size:9px;color:#8B7355;opacity:0.7;}
body{padding-top:56px;}
@media print{
  .controls{display:none!important;}
  body{padding-top:0;background:white;}
}

/* ═══════ PRINT PAGE (A4 landscape grid 3×1) ═══════ */
.print-page{
  width:281mm;
  min-height:194mm;
  display:grid;
  grid-template-columns:71mm 71mm 71mm;
  grid-template-rows:120.5mm;
  justify-content:center;
  align-content:center;
  gap:6mm 12mm;
  page-break-after:always;
  page-break-inside:avoid;
  margin:10mm auto;
}
@media print{
  .print-page{margin:0 auto;}
}

/* ═══════ SECTION DIVIDER PAGE ═══════ */
.section-page{
  width:281mm;min-height:194mm;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  page-break-after:always;
  margin:10mm auto;
  text-align:center;
}
.section-page h2{
  font-family:'Cinzel',serif;font-size:28pt;
  color:#8B7355;letter-spacing:4pt;margin-bottom:8mm;
}
.section-page p{
  font-family:'Cinzel',serif;font-size:10pt;
  color:#d4c8b0;letter-spacing:2pt;opacity:0.7;
}

/* ═══════ COVER PAGE ═══════ */
.cover-page{
  width:281mm;min-height:194mm;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  page-break-after:always;
  margin:10mm auto;
  text-align:center;
  position:relative;
}
.cover-page::before{
  content:'';position:absolute;inset:0;
  border:3mm solid #8B7355;border-radius:5mm;
  background:radial-gradient(ellipse at 50% 40%,rgba(139,115,85,0.12) 0%,transparent 70%),
  linear-gradient(180deg,#1c1c1c 0%,#0d0d0d 100%);
}
.cover-page>*{position:relative;z-index:1;}
.cover-title{
  font-family:'Cinzel',serif;font-size:36pt;font-weight:900;
  color:#8B7355;letter-spacing:5pt;line-height:1.2;
}
.cover-subtitle{
  font-family:'Cinzel',serif;font-size:14pt;
  color:#d4c8b0;letter-spacing:3pt;margin-top:6mm;
}
.cover-author{
  font-family:'Cinzel',serif;font-size:8pt;
  color:rgba(139,115,85,0.5);letter-spacing:2pt;
  margin-top:20mm;
}
.cover-emblem{font-size:60pt;margin:12mm 0;}
.cover-info{
  font-family:'Crimson Text',serif;font-size:9pt;
  color:#8B7355;opacity:0.6;margin-top:5mm;line-height:1.6;
}

/* ═══════ CARD BASE ═══════ */
.card{
  width:71mm;height:120.5mm;
  border:2mm solid #8B7355;border-radius:2.5mm;
  padding:2.5mm;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:#1c1c1c;
}
.card::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(139,115,85,0.12) 0%,transparent 60%),
    radial-gradient(ellipse at 70% 80%,rgba(139,115,85,0.08) 0%,transparent 50%),
    linear-gradient(180deg,rgba(28,28,28,1) 0%,rgba(18,16,13,1) 100%);
  z-index:0;
}
.card>*{position:relative;z-index:1;}

/* ═══ CORNERS ═══ */
.corner{position:absolute;width:8mm;height:8mm;z-index:2;}
.corner svg{width:100%;height:100%;}
.corner-tl{top:0.5mm;left:0.5mm;}
.corner-tr{top:0.5mm;right:0.5mm;transform:scaleX(-1);}
.corner-bl{bottom:0.5mm;left:0.5mm;transform:scaleY(-1);}
.corner-br{bottom:0.5mm;right:0.5mm;transform:scale(-1,-1);}

/* ═══ TERRITORY FRONT ═══ */
.card-header{text-align:center;padding:1mm 0 0.8mm;border-bottom:0.3mm solid rgba(139,115,85,0.4);margin-bottom:0.5mm;}
.game-title{font-family:'Cinzel',serif;font-size:5.5pt;letter-spacing:2pt;text-transform:uppercase;color:#8B7355;margin-bottom:0.3mm;}
.region-name{font-family:'Cinzel',serif;font-size:10pt;font-weight:900;letter-spacing:0.6pt;text-transform:uppercase;margin-bottom:0.3mm;}
.macro-region{font-family:'Cinzel',serif;font-size:7pt;letter-spacing:1.2pt;text-transform:uppercase;opacity:0.75;}

.sigil{
  width:7.5mm;height:7.5mm;margin:0.4mm auto;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:0.3mm solid rgba(139,115,85,0.5);
}
.sigil svg{width:5.5mm;height:5.5mm;}
.sigil img{width:5.5mm;height:5.5mm;object-fit:contain;}

.data-section{flex:0 0 auto;padding:0.5mm 1mm;}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.4mm 1.5mm;}
.data-item{display:flex;justify-content:space-between;align-items:baseline;padding:0.3mm 0.8mm;border-bottom:0.15mm dotted rgba(139,115,85,0.2);}
.data-label{font-size:5.5pt;color:#8B7355;text-transform:uppercase;letter-spacing:0.2pt;font-family:'Cinzel',serif;font-weight:700;}
.data-value{font-size:7.5pt;font-weight:600;color:#f0e6d2;}

/* PLAND color coding */
.pland-high{color:#66BB6A;}
.pland-med{color:#FFC107;}
.pland-low{color:#EF5350;}

.bar-container{grid-column:1/-1;padding:0.3mm 0.8mm 0;}
.bar-label-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.2mm;}
.bar-outer{width:100%;height:1.8mm;background:rgba(139,115,85,0.15);border-radius:1mm;overflow:hidden;}
.bar-inner{height:100%;border-radius:1mm;}
.conn-high{background:linear-gradient(90deg,#2E7D32,#4CAF50);}
.conn-med{background:linear-gradient(90deg,#F57F17,#FFC107);}
.conn-low{background:linear-gradient(90deg,#C62828,#E53935);}

.challenge-section{
  flex:1 1 auto;margin-top:0.8mm;padding:1.2mm 1.8mm;
  background:rgba(139,115,85,0.06);
  border:0.25mm solid rgba(139,115,85,0.25);
  border-radius:1.2mm;display:flex;flex-direction:column;
}
.challenge-title{font-family:'Cinzel',serif;font-size:5.5pt;text-transform:uppercase;letter-spacing:1.2pt;color:#8B7355;text-align:center;margin-bottom:0.8mm;}
.challenge-text{font-size:7pt;line-height:1.3;color:#d4c8b0;text-align:justify;hyphens:auto;}

.card-footer{text-align:center;padding-top:0.3mm;border-top:0.2mm solid rgba(139,115,85,0.2);margin-top:auto;}
.footer-text{font-family:'Cinzel',serif;font-size:4pt;letter-spacing:0.8pt;color:rgba(139,115,85,0.5);text-transform:uppercase;}

/* ═══ MACRO-REGION COLORS ═══ */
.the-north .region-name{color:#A0B4C8;}
.the-north .sigil{border-color:#A0B4C8;background:rgba(160,180,200,0.08);}
.the-north .card-header{border-bottom-color:rgba(160,180,200,0.35);}

.the-vale .region-name{color:#7BA7CC;}
.the-vale .sigil{border-color:#7BA7CC;background:rgba(123,167,204,0.08);}
.the-vale .card-header{border-bottom-color:rgba(123,167,204,0.35);}

.the-riverlands .region-name{color:#C87E5A;}
.the-riverlands .sigil{border-color:#C87E5A;background:rgba(200,126,90,0.08);}
.the-riverlands .card-header{border-bottom-color:rgba(200,126,90,0.35);}

.the-westerlands .region-name{color:#D4A843;}
.the-westerlands .sigil{border-color:#D4A843;background:rgba(212,168,67,0.08);}
.the-westerlands .card-header{border-bottom-color:rgba(212,168,67,0.35);}

.the-reach .region-name{color:#7CB868;}
.the-reach .sigil{border-color:#7CB868;background:rgba(124,184,104,0.08);}
.the-reach .card-header{border-bottom-color:rgba(124,184,104,0.35);}

.the-stormlands .region-name{color:#C8B45A;}
.the-stormlands .sigil{border-color:#C8B45A;background:rgba(200,180,90,0.08);}
.the-stormlands .card-header{border-bottom-color:rgba(200,180,90,0.35);}

.dorne .region-name{color:#E07A3A;}
.dorne .sigil{border-color:#E07A3A;background:rgba(224,122,58,0.08);}
.dorne .card-header{border-bottom-color:rgba(224,122,58,0.35);}

.the-crownlands .region-name{color:#C84040;}
.the-crownlands .sigil{border-color:#C84040;background:rgba(200,64,64,0.08);}
.the-crownlands .card-header{border-bottom-color:rgba(200,64,64,0.35);}

.iron-islands .region-name{color:#8A8A8A;}
.iron-islands .sigil{border-color:#8A8A8A;background:rgba(138,138,138,0.08);}
.iron-islands .card-header{border-bottom-color:rgba(138,138,138,0.35);}

/* ═══ CARD BACK (TERRITORY) ═══ */
.card-back{
  width:71mm;height:120.5mm;
  border:2mm solid #8B7355;border-radius:2.5mm;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#1c1c1c;
}
.card-back::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 5mm,rgba(139,115,85,0.03) 5mm,rgba(139,115,85,0.03) 6mm),
    repeating-linear-gradient(-45deg,transparent,transparent 5mm,rgba(139,115,85,0.03) 5mm,rgba(139,115,85,0.03) 6mm),
    radial-gradient(ellipse at 50% 50%,rgba(139,115,85,0.1) 0%,transparent 60%),
    linear-gradient(180deg,#1c1c1c 0%,#0e0c0a 100%);
  z-index:0;
}
.back-inner{
  position:relative;z-index:1;
  width:calc(100% - 8mm);height:calc(100% - 8mm);
  border:0.4mm solid rgba(139,115,85,0.35);
  border-radius:1.5mm;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
}
.back-inner::before{
  content:'';position:absolute;inset:2mm;
  border:0.2mm solid rgba(139,115,85,0.15);
  border-radius:1mm;
}
.back-fleur{
  position:absolute;font-size:14pt;color:rgba(139,115,85,0.3);
  font-family:serif;
}
.back-fleur-tl{top:2mm;left:3mm;}
.back-fleur-tr{top:2mm;right:3mm;transform:scaleX(-1);}
.back-fleur-bl{bottom:2mm;left:3mm;transform:scaleY(-1);}
.back-fleur-br{bottom:2mm;right:3mm;transform:scale(-1,-1);}

.back-title-pre{
  font-family:'Cinzel',serif;font-size:7pt;
  letter-spacing:3pt;color:#8B7355;
  text-transform:uppercase;margin-bottom:1mm;
}
.back-title-main{
  font-family:'Cinzel',serif;font-size:14pt;font-weight:900;
  letter-spacing:2.5pt;color:#8B7355;
}
.back-emblem{
  font-size:30pt;margin:3mm 0;
  filter:drop-shadow(0 0 8px rgba(139,115,85,0.3));
}
.back-swords{
  font-family:'Cinzel',serif;font-size:8pt;
  color:rgba(139,115,85,0.5);letter-spacing:4pt;
  margin-bottom:1mm;
}
.back-subtitle{
  font-family:'Cinzel',serif;font-size:6pt;
  letter-spacing:2pt;color:rgba(139,115,85,0.4);
  text-transform:uppercase;
}
.back-bottom{
  position:absolute;bottom:4mm;
  font-family:'Cinzel',serif;font-size:3.5pt;
  letter-spacing:1.5pt;color:rgba(139,115,85,0.3);
}

/* ═══ MISSION CARD BACK ═══ */
.card-back-mission{border-color:#8B4040;}
.card-back-mission::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg,transparent,transparent 5mm,rgba(200,64,64,0.03) 5mm,rgba(200,64,64,0.03) 6mm),
    repeating-linear-gradient(-45deg,transparent,transparent 5mm,rgba(200,64,64,0.03) 5mm,rgba(200,64,64,0.03) 6mm),
    radial-gradient(ellipse at 50% 50%,rgba(200,64,64,0.08) 0%,transparent 60%),
    linear-gradient(180deg,#1c1c1c 0%,#0e0a0a 100%);
  z-index:0;
}
.card-back-mission .back-inner{border-color:rgba(200,64,64,0.3);}
.card-back-mission .back-inner::before{border-color:rgba(200,64,64,0.12);}
.card-back-mission .back-fleur{color:rgba(200,64,64,0.25);}
.card-back-mission .back-title-pre,.card-back-mission .back-title-main{color:#C84040;}
.card-back-mission .back-swords,.card-back-mission .back-subtitle{color:rgba(200,64,64,0.4);}
.card-back-mission .back-bottom{color:rgba(200,64,64,0.25);}

/* ═══ MISSION FRONT ═══ */
.mission-header{text-align:center;padding:1.5mm 0 1mm;border-bottom:0.3mm solid rgba(139,115,85,0.4);}
.mission-game-title{font-family:'Cinzel',serif;font-size:5.5pt;letter-spacing:1.8pt;text-transform:uppercase;color:#8B7355;}
.mission-card-type{font-family:'Cinzel',serif;font-size:10pt;font-weight:900;letter-spacing:1.2pt;text-transform:uppercase;color:#C84040;margin:0.8mm 0;}
.mission-number{width:8mm;height:8mm;margin:1mm auto;border-radius:50%;border:0.4mm solid #8B7355;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:12pt;font-weight:900;color:#C84040;}
.mission-title{font-family:'Cinzel',serif;font-size:9pt;font-weight:700;text-align:center;color:#f0e6d2;margin:1.5mm 1mm;letter-spacing:0.4pt;}
.mission-desc{font-size:7pt;line-height:1.3;text-align:center;color:#d4c8b0;margin:0.8mm 1mm;flex:1;}
.mission-objective{background:rgba(139,115,85,0.08);border:0.25mm solid rgba(139,115,85,0.25);border-radius:1.2mm;padding:1.5mm 2.5mm;margin:1mm 1mm;}
.mission-obj-title{font-family:'Cinzel',serif;font-size:5.5pt;text-transform:uppercase;letter-spacing:0.8pt;color:#8B7355;text-align:center;margin-bottom:0.8mm;}
.mission-obj-text{font-size:8pt;line-height:1.25;text-align:center;color:#f0e6d2;font-weight:600;}
.mission-concept{font-size:6pt;line-height:1.25;text-align:center;color:rgba(139,115,85,0.6);font-style:italic;margin:1mm 1.5mm 0;padding-top:0.8mm;border-top:0.15mm dotted rgba(139,115,85,0.25);}

/* ═══ REFERENCE CARD ═══ */
.ref-card{
  width:71mm;height:120.5mm;
  border:2mm solid #2E7D32;border-radius:2.5mm;
  padding:2.5mm;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:#1c1c1c;
}
.ref-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(46,125,50,0.06) 0%,rgba(20,18,15,1) 100%);
  z-index:0;
}
.ref-card>*{position:relative;z-index:1;}
.ref-header{text-align:center;padding:0.8mm 0;border-bottom:0.3mm solid rgba(46,125,50,0.4);margin-bottom:0.8mm;}
.ref-title{font-family:'Cinzel',serif;font-size:7.5pt;font-weight:900;letter-spacing:0.8pt;text-transform:uppercase;color:#4CAF50;}
.ref-subtitle{font-family:'Cinzel',serif;font-size:5pt;letter-spacing:0.8pt;color:rgba(76,175,80,0.5);}
.ref-section{margin:0.6mm 0;}
.ref-section-title{font-family:'Cinzel',serif;font-size:5.5pt;font-weight:700;color:#4CAF50;text-transform:uppercase;letter-spacing:0.6pt;border-bottom:0.15mm solid rgba(76,175,80,0.25);padding-bottom:0.2mm;margin-bottom:0.3mm;}
.ref-item{font-size:5pt;line-height:1.15;color:#d4c8b0;padding:0.12mm 0;}
.ref-item strong{color:#f0e6d2;font-weight:600;}
.ref-formula{font-family:'Courier New',monospace;font-size:5pt;color:#A5D6A7;background:rgba(46,125,50,0.08);padding:0.2mm 0.8mm;border-radius:0.3mm;display:inline-block;margin:0.1mm 0;}

/* ═══ MAP PAGE ═══ */
.map-page{
  width:281mm;min-height:194mm;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  page-break-after:always;
  margin:10mm auto;
}
@media print{.map-page{margin:0 auto;}}
.map-page svg{max-width:260mm;max-height:178mm;}

/* ═══ NARRATIVE CARDS ═══ */
.house-cover{width:71mm;height:120.5mm;border:2mm solid var(--hc);border-radius:2.5mm;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#1c1c1c;}
.house-cover::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,var(--hc-glow) 0%,transparent 65%),linear-gradient(180deg,#1c1c1c 0%,#0e0c0a 100%);z-index:0;}
.house-cover>*{position:relative;z-index:1;}
.house-cover .hc-emblem{margin-bottom:3mm;filter:drop-shadow(0 0 10px var(--hc-glow));}
.house-cover .hc-emblem img{width:28mm;height:28mm;object-fit:contain;}
.house-cover .hc-name{font-family:'Cinzel',serif;font-size:16pt;font-weight:900;letter-spacing:2pt;color:var(--hc);text-transform:uppercase;}
.house-cover .hc-motto{font-family:'Crimson Text',serif;font-size:9pt;font-style:italic;color:var(--hc);opacity:0.6;margin-top:1.5mm;}
.house-cover .hc-region{font-family:'Cinzel',serif;font-size:7pt;letter-spacing:1.5pt;color:var(--hc);opacity:0.4;margin-top:3mm;text-transform:uppercase;}
.house-cover .hc-count{font-family:'Cinzel',serif;font-size:5.5pt;letter-spacing:1pt;color:rgba(139,115,85,0.35);position:absolute;bottom:3mm;}
.house-cover .hc-border{position:absolute;inset:3mm;border:0.3mm solid var(--hc);opacity:0.25;border-radius:1.5mm;}
.house-cover .hc-border-inner{position:absolute;inset:5mm;border:0.15mm solid var(--hc);opacity:0.12;border-radius:1mm;}

.narr-card{width:71mm;height:120.5mm;border:2mm solid var(--hc);border-radius:2.5mm;padding:2mm 2.5mm;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#1c1c1c;}
.narr-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 15%,var(--hc-glow) 0%,transparent 55%),linear-gradient(180deg,rgba(28,28,28,1) 0%,rgba(18,16,13,1) 100%);z-index:0;}
.narr-card>*{position:relative;z-index:1;}
.nc-corner{position:absolute;width:7mm;height:7mm;z-index:2;}
.nc-corner svg{width:100%;height:100%;}
.nc-corner-tl{top:0.4mm;left:0.4mm;}
.nc-corner-tr{top:0.4mm;right:0.4mm;transform:scaleX(-1);}
.nc-corner-bl{bottom:0.4mm;left:0.4mm;transform:scaleY(-1);}
.nc-corner-br{bottom:0.4mm;right:0.4mm;transform:scale(-1,-1);}
.nc-header{text-align:center;padding:1mm 0 0.6mm;border-bottom:0.25mm solid var(--hc-dim);margin-bottom:0.4mm;}
.nc-game{font-family:'Cinzel',serif;font-size:5pt;letter-spacing:1.5pt;text-transform:uppercase;color:#8B7355;margin-bottom:0.2mm;}
.nc-house{font-family:'Cinzel',serif;font-size:8pt;font-weight:900;letter-spacing:0.8pt;text-transform:uppercase;color:var(--hc);}
.nc-num{font-family:'Cinzel',serif;font-size:5pt;letter-spacing:1pt;color:var(--hc);opacity:0.5;margin-top:0.2mm;}
.nc-sigil{width:8mm;height:8mm;margin:0.3mm auto;display:flex;align-items:center;justify-content:center;border-radius:50%;border:0.25mm solid var(--hc-dim);}
.nc-sigil img{width:6mm;height:6mm;object-fit:contain;}
.nc-narrative{flex:0 0 auto;margin:0.5mm 0;padding:1.5mm 2mm;background:rgba(139,115,85,0.04);border:0.2mm solid rgba(139,115,85,0.15);border-radius:1mm;}
.nc-narr-title{font-family:'Cinzel',serif;font-size:5pt;text-transform:uppercase;letter-spacing:1pt;color:#8B7355;text-align:center;margin-bottom:0.6mm;}

function groupIntoPages(items, perPage) {
  const pages = [];
  for (let i = 0; i < items.length; i += perPage) {
    pages.push(items.slice(i, i + perPage));
  }
  return pages;
}

function wrapPage(cardsHtml) {
  return `<div class="print-page">${cardsHtml}</div>`;
}

function buildSection(title, subtitle) {
  return `<div class="section-page"><h2>${title}</h2><p>${subtitle}</p></div>`;
}

function buildReferenceFront() {
  return `
  <div class="ref-card">
    <div class="ref-header">

      <div class="ref-subtitle">Risk of Landscapes — Frente</div>
    </div>
    <div class="ref-section">
      <div class="ref-section-title">Modelo Mancha-Corredor-Matriz</div>
      <div class="ref-item"><strong>Mancha (patch):</strong> área homogênea que difere do entorno</div>
      <div class="ref-item"><strong>Corredor:</strong> elemento linear conectando manchas</div>
      <div class="ref-item"><strong>Matriz:</strong> elemento dominante ("fundo" da paisagem)</div>
    </div>
    <div class="ref-section">
      <div class="ref-section-title">Métricas-chave</div>
      <div class="ref-item"><strong>PLAND</strong> — % da paisagem coberta pela classe <em>i</em></div>
      <div class="ref-item"><span class="ref-formula">PLAND = (Σ aᵢⱼ / A) × 100</span></div>
      <div class="ref-item"><strong>NP</strong> — Número total de manchas (fragmentos)</div>
      <div class="ref-item"><strong>AREA_MN</strong> — Área total da classe ÷ NP (tamanho médio)</div>
      <div class="ref-item"><strong>SHDI</strong> — Diversidade composicional de Shannon</div>
      <div class="ref-item"><span class="ref-formula">SHDI = −Σ pᵢ · ln(pᵢ)</span></div>
      <div class="ref-item"><strong>ED</strong> — Comprimento de borda ÷ Área total (m/ha)</div>
      <div class="ref-item"><strong>CORE</strong> — % interior protegida do efeito de borda</div>
      <div class="ref-item"><strong>CONNECT</strong> — Índice de conectividade funcional (0–100)</div>
      <div class="ref-item"><strong>SE</strong> — Índice composto de serviços ecossistêmicos (0–100)</div>
    </div>
    <div class="ref-section">
      <div class="ref-section-title">Relações entre métricas</div>
      <div class="ref-item">PLAND ↑ → NP ↓ , AREA_MN ↑ , CONNECT ↑</div>
      <div class="ref-item">NP ↑ → ED ↑ , CORE ↓</div>
      <div class="ref-item">ED ↑ → CORE ↓ (inversamente proporcionais)</div>
      <div class="ref-item">SHDI alto ≠ PLAND alto (diversidade ≠ cobertura)</div>
    </div>
    <div class="card-footer"><div class="footer-text" style="color:rgba(76,175,80,0.5);">Análise da Paisagem — UEFS</div></div>
  </div>`;
}

function buildMap() {
  const W = 620, H = 880;
  let svg = `

  <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:auto;height:178mm;">

      <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="sea-grad" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#1a2940"/><stop offset="100%" stop-color="#0a1520"/></radialGradient>
      <pattern id="wave" width="30" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
        <path d="M0,4 Q7.5,0 15,4 Q22.5,8 30,4" stroke="rgba(100,150,200,0.08)" fill="none" stroke-width="0.5"/>
      </pattern>
    </defs>

    <!-- Sea background -->
    <rect width="${W}" height="${H}" fill="url(#sea-grad)" rx="8"/>
    <rect width="${W}" height="${H}" fill="url(#wave)" rx="8"/>

    <!-- Continent silhouette -->
    <path d="
      M160,40 L440,38 L470,55 L490,100 L480,155 L500,210 L510,280
      L490,320 L520,360 L530,400 L520,440 L540,480 L520,530
      L500,560 L510,610 L490,660 L470,700 L500,740 L480,780
      L440,800 L380,810 L320,790 L260,800 L200,770 L160,730
      L130,680 L110,620 L100,560 L80,500 L70,440 L60,380
      L80,330 L70,280 L80,220 L90,160 L100,100 L120,60 Z"
      fill="#1a1810" stroke="rgba(139,115,85,0.3)" stroke-width="1.5"/>

    <!-- Continent texture overlay -->
    <path d="
      M160,40 L440,38 L470,55 L490,100 L480,155 L500,210 L510,280
      L490,320 L520,360 L530,400 L520,440 L540,480 L520,530
      L500,560 L510,610 L490,660 L470,700 L500,740 L480,780
      L440,800 L380,810 L320,790 L260,800 L200,770 L160,730
      L130,680 L110,620 L100,560 L80,500 L70,440 L60,380
      L80,330 L70,280 L80,220 L90,160 L100,100 L120,60 Z"
      fill="url(#wave)" opacity="0.5"/>

    <!-- The Wall -->
    <line x1="140" y1="50" x2="460" y2="48" stroke="#A0B4C8" stroke-width="3" stroke-dasharray="4,2" opacity="0.6"/>
    <text x="300" y="38" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#A0B4C8" opacity="0.6" letter-spacing="3">THE WALL</text>

    <!-- Iron Islands (separate) -->
    <ellipse cx="45" cy="355" rx="22" ry="18" fill="#2a2a2a" stroke="rgba(138,138,138,0.4)" stroke-width="1"/>
    <ellipse cx="45" cy="430" rx="22" ry="18" fill="#2a2a2a" stroke="rgba(138,138,138,0.4)" stroke-width="1"/>
    <!-- Dragonstone (island) -->
    <ellipse cx="555" cy="510" rx="20" ry="16" fill="#2a2a2a" stroke="rgba(200,64,64,0.4)" stroke-width="1"/>`;

  // Draw edges
  mapEdges.forEach(e => {
    const a = mapNodes[e.a], b = mapNodes[e.b];
    const dashStyle = e.sea ? 'stroke-dasharray="6,4"' : '';
    const color = e.sea ? 'rgba(100,160,220,0.35)' : 'rgba(139,115,85,0.3)';
    const width = e.sea ? '1' : '1.2';
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${width}" ${dashStyle}/>`;
  });

  // Draw nodes
  Object.entries(mapNodes).forEach(([key, n]) => {
    const r = 24;
    const sigilContent = n.svg
      ? `<image href="${n.svg}" x="${n.x-12}" y="${n.y-12}" width="24" height="24"/>`
      : `<text x="${n.x}" y="${n.y+4}" text-anchor="middle" font-size="16">${n.sigil}</text>`;
    svg += `
    <g filter="url(#glow)">
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="#1c1c1c" stroke="${n.color}" stroke-width="1.8" opacity="0.95"/>
      <circle cx="${n.x}" cy="${n.y}" r="${r-3}" fill="none" stroke="${n.color}" stroke-width="0.3" opacity="0.4"/>
      ${sigilContent}

    // Label below node
    const labelY = n.y + r + 10;
    svg += `
    <text x="${n.x}" y="${labelY}" text-anchor="middle" font-family="Cinzel,serif" font-size="7.5" font-weight="700" fill="${n.color}" letter-spacing="0.5">${n.label}</text>`;

  const legendItems = [
    {color:"#A0B4C8",label:"The North"},
    {color:"#7BA7CC",label:"The Vale"},
    {color:"#C87E5A",label:"The Riverlands"},
    {color:"#D4A843",label:"The Westerlands"},
    {color:"#7CB868",label:"The Reach"},
    {color:"#C8B45A",label:"The Stormlands"},
    {color:"#E07A3A",label:"Dorne"},
    {color:"#C84040",label:"The Crownlands"},
    {color:"#8A8A8A",label:"Iron Islands"}
  ];
  legendItems.forEach((item, i) => {
    const ly = 35 + i * 22;
    svg += `
      <circle cx="18" cy="${ly}" r="6" fill="#1c1c1c" stroke="${item.color}" stroke-width="1.2"/>
      <text x="30" y="${ly+3}" font-family="Cinzel,serif" font-size="6" fill="${item.color}">${item.label}</text>`;
  });

  svg += `
      <line x1="8" y1="235" x2="87" y2="235" stroke="rgba(139,115,85,0.2)" stroke-width="0.5"/>
      <line x1="12" y1="244" x2="35" y2="244" stroke="rgba(139,115,85,0.3)" stroke-width="1"/>
      <text x="40" y="247" font-size="5" fill="rgba(139,115,85,0.5)">Terra</text>
      <line x1="12" y1="254" x2="35" y2="254" stroke="rgba(100,160,220,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="40" y="257" font-size="5" fill="rgba(100,160,220,0.5)">Mar</text>
    </g>

    <!-- Compass rose -->
    <g transform="translate(560,80)">
      <circle cx="0" cy="0" r="18" fill="rgba(28,28,28,0.8)" stroke="rgba(139,115,85,0.3)" stroke-width="0.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="rgba(139,115,85,0.4)" stroke-width="0.5"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="rgba(139,115,85,0.4)" stroke-width="0.5"/>
      <polygon points="0,-13 -3,-4 3,-4" fill="#8B7355"/>
      <polygon points="0,13 -3,4 3,4" fill="rgba(139,115,85,0.3)"/>
      <text x="0" y="-16" text-anchor="middle" font-family="Cinzel,serif" font-size="7" font-weight="700" fill="#8B7355">N</text>
      <text x="0" y="24" text-anchor="middle" font-family="Cinzel,serif" font-size="5" fill="rgba(139,115,85,0.4)">S</text>
      <text x="20" y="3" text-anchor="middle" font-family="Cinzel,serif" font-size="5" fill="rgba(139,115,85,0.4)">E</text>
      <text x="-20" y="3" text-anchor="middle" font-family="Cinzel,serif" font-size="5" fill="rgba(139,115,85,0.4)">O</text>
    </g>
  </svg>
  </div>`;

  return svg;
}

      {n:"Stannis queimou florestas em Dragonstone. Dragonstone (NP=8, AREA_MN=7.100) tem poucos fragmentos mas muito grandes.",c:"Compare estratégias para: (a) Dragonstone — poucos grandes, alta conectividade; (b) Storm's End — muitos médios. Qual é mais resiliente?"},
      {n:"SE de Storm's End (65/100) moderado-alto: regulação boa, mas provisão limitada pelo clima tempestuoso.",c:"Distúrbio natural (tempestades) reduz provisão mas mantém regulação e suporte. Compare com distúrbio antrópico (mineração) que destrói ambos."},
      {n:"Relâmpagos causam incêndios: 3% da cobertura queima anualmente, mas regenera em 5-10 anos. Mosaico de estágios sucessionais.",c:"Fogo natural cria mosaico de manchas em diferentes estágios. Como isso AUMENTA SHDI e pode beneficiar biodiversidade? Quando fogo deixa de ser 'natural'?"},
      {n:"Pescadores relatam que espécies marinhas que desovam em rios dependem da mata ciliar costeira (NP=28) para larvas.",c:"Interface terra-mar é uma ecotone. Como a fragmentação costeira afeta? A ED alta (44,3) em Shipbreaker Bay é boa ou ruim para espécies de transição?"},
      {n:"Renly sonhava em transformar The Stormlands no 'jardim de Westeros'. O Meister adverte: estabilizar uma paisagem naturalmente dinâmica pode ser danoso.",c:"'Naturalidade do distúrbio': tentar suprimir tempestades/incêndios pode ser prejudicial? Compare com 'deixar a natureza agir'. Quando intervenção é necessária vs. contraproducente?"}
    ]}
  };

  function ncCorners(){return['tl','tr','bl','br'].map(p=>`<div class="nc-corner nc-corner-${p}"><svg><use href="#corner-orn"/></svg></div>`).join('');}
  function renderHouseCover(h){return`<div class="house-cover ${h.css}"><div class="hc-border"></div><div class="hc-border-inner"></div><div class="hc-emblem"><img src="${h.sigil}" alt="${h.name}"></div><div class="hc-name">${h.name}</div><div class="hc-motto">"${h.motto}"</div><div class="hc-region">${h.region}</div><div class="hc-count">10 CARTAS NARRATIVAS — RISK OF LANDSCAPES</div></div>`;}
  function renderNarrCard(h,card,idx){return`<div class="narr-card ${h.css}">${ncCorners()}<div class="nc-header"><div class="nc-game">Risk of Landscapes</div><div class="nc-house">${h.name}</div><div class="nc-num">Carta ${String(idx+1).padStart(2,'0')} de 10</div></div><div class="nc-sigil"><img src="${h.sigil}" alt=""></div><div class="nc-narrative"><div class="nc-narr-title">📜 Narrativa</div><div class="nc-narr-text">${card.n}</div></div><div class="nc-challenge"><div class="nc-chal-title">⚔ Desafio da Paisagem ⚔</div><div class="nc-chal-text">${card.c}</div></div><div class="nc-footer"><div class="nc-footer-text">Valar Morghulis — Todas as paisagens mudam</div></div></div>`;}

  let narrHtml = buildSection('CARTAS NARRATIVAS','8 CASAS × 10 CARTAS = 80 NARRATIVAS');
  Object.values(housesData).forEach(h => {
    const allCards = [renderHouseCover(h)];
    h.cards.forEach((c,i) => allCards.push(renderNarrCard(h,c,i)));
    const pages = groupIntoPages(allCards, 3);
    pages.forEach(page => { narrHtml += wrapPage(page.join('')); });
  });
  document.getElementById('narrative-section').innerHTML = narrHtml;

  // --- Toggle controls ---
  const toggles = [
    { id: 'chk-cover', section: 'cover-section' },
    { id: 'chk-tf', section: 'territory-fronts-section' },
    { id: 'chk-tb', section: 'territory-backs-section' },
    { id: 'chk-mf', section: 'mission-fronts-section' },
    { id: 'chk-mb', section: 'mission-backs-section' },
    { id: 'chk-ref', section: 'reference-section' },
    { id: 'chk-map', section: 'map-section' },
    { id: 'chk-narr', section: 'narrative-section' }
  ];
  toggles.forEach(t => {
    const chk = document.getElementById(t.id);
    const sec = document.getElementById(t.section);
    chk.addEventListener('change', () => {
      sec.classList.toggle('hidden', !chk.checked);
    });
  });
});
</script>
